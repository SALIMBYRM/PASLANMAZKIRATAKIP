<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PASLANMAZLAR KİRA VE GİDER TAKİP</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary-color: #1e3a8a;
            --success-color: #16a34a;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-color: #1e293b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        #loginOverlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.85);
            display: flex; justify-content: center; align-items: center;
            z-index: 1000;
        }

        .login-card {
            background: white; padding: 30px; border-radius: 12px;
            width: 100%; max-width: 400px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);
            text-align: center;
        }

        .login-card select, .login-card input {
            width: 100%; padding: 12px; margin-bottom: 15px;
            border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box;
        }

        .login-btn {
            width: 100%; padding: 12px; background: var(--primary-color);
            color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;
        }

        .login-error { color: #dc2626; margin-top: 10px; font-size: 0.9rem; display: none; }

        .container { max-width: 1200px; margin: 0 auto; display: none; }

        header {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--card-bg); padding: 20px; border-radius: 10px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); margin-bottom: 20px;
        }

        .tabs { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab-btn {
            padding: 10px 20px; border: none; background: #cbd5e1;
            cursor: pointer; border-radius: 6px; font-weight: 600;
            user-select: none;
        }
        .tab-btn.active { background: var(--primary-color); color: white; }

        .card {
            background: var(--card-bg); padding: 20px; border-radius: 10px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); margin-bottom: 20px;
        }

        .form-group { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }

        input, select {
            padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px;
            flex: 1; min-width: 140px;
        }

        button.btn {
            background: var(--success-color); color: white; border: none;
            padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: 600;
            white-space: nowrap;
        }

        button.btn-danger {
            background: #dc2626; color: white; border: none;
            padding: 6px 12px; border-radius: 4px; cursor: pointer;
        }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #e2e8f0; font-size: 0.9rem; }
        th { background: #f1f5f9; }

        .badge { background: #e0f2fe; color: #0369a1; padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 600; }
        .note-input { width: 110px; padding: 5px; font-size: 0.8rem; border: 1px solid #cbd5e1; border-radius: 4px; }

        .alert-box {
            background: #fffbeb; border-left: 4px solid #f59e0b; padding: 15px;
            border-radius: 6px; margin-bottom: 20px;
        }
        .reminder-row {
            display: flex; justify-content: space-between; align-items: center;
            background: #ffffff; padding: 10px; border-radius: 6px; margin-bottom: 6px;
            border: 1px solid #fde68a; cursor: pointer; font-weight: 600;
        }
        .reminder-row.read { background: #f8fafc; color: #94a3b8; text-decoration: line-through; }

        .panel-box {
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .panel-title {
            font-weight: bold;
            font-size: 0.95rem;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
    </style>
</head>
<body>

<!-- GİRİŞ EKRANI -->
<div id="loginOverlay">
    <div class="login-card">
        <div style="font-size: 3rem; margin-bottom: 10px;">🏢</div>
        <h2>PASLANMAZLAR</h2>
        <p>Kira Takip Sistemine Giriş</p>
        <select id="loginUser">
            <option value="Rabia">Rabia</option>
            <option value="Salim">Salim</option>
            <option value="Mahmut">Mahmut</option>
        </select>
        <input type="password" id="loginPassword" placeholder="Şifre">
        <button class="login-btn" onclick="handleLogin()">Giriş Yap</button>
        <div id="loginError" class="login-error">Hatalı şifre!</div>
    </div>
</div>

<!-- ANA UYGULAMA -->
<div class="container" id="mainAppContainer">
    <header>
        <div>
            <h2 style="margin: 0; color: var(--primary-color);">🏢 PASLANMAZLAR KİRA & GİDER TAKİP</h2>
        </div>
        <div>
            <span>Kullanıcı: <b id="displayUser" style="color: var(--primary-color);"></b></span>
            <button class="btn-danger" onclick="handleLogout()" style="margin-left: 10px;">Çıkış</button>
        </div>
    </header>

    <div id="reminderContainer"></div>

    <div class="card" style="background: #f8fafc;">
        <h3 style="margin-top:0;">➕ Yeni Apartman Ekle</h3>
        <div class="form-group" style="margin-bottom:0;">
            <input type="text" id="newApartmentNameInput" placeholder="Apartman Adı">
            <button class="btn" style="background: var(--primary-color);" onclick="addNewApartment()">Ekle</button>
        </div>
    </div>

    <!-- Apartman Sekmeleri (Silmek için bir sekmeye 4 defa peş peşe tıklayın) -->
    <div class="tabs" id="apartmentTabs"></div>

    <div class="card">
        <h3>🚪 Yeni Daire Ekle (<span id="activeApartmentTitle">Paslanmaz Apart</span>)</h3>
        <div class="form-group">
            <input type="text" id="roomNumber" placeholder="Daire No (Örn: Daire 1)">
            <input type="text" id="tenantName" placeholder="Kiracı Adı">
            <input type="number" id="rentAmount" placeholder="Kira Tutarı (TL)">
            <input type="date" id="startDate">
            <select id="paymentDay">
                <script>
                    for(let i=1; i<=31; i++) document.write(`<option value="${i}">Her ayın ${i}. günü</option>`);
                </script>
            </select>
            <button class="btn" onclick="addRoom()">Daireyi Ekle</button>
        </div>
    </div>

    <div class="card">
        <h3>🔍 Kiracı Seçimi ve Aylık Kira Durumu</h3>
        <div class="form-group" style="align-items: center; background: #f8fafc; padding: 15px; border-radius: 8px;">
            <label for="selectedTenantSelect" style="font-weight: bold;">Kiracı Seç:</label>
            <select id="selectedTenantSelect" onchange="renderTenantDetails()"></select>
            <button class="btn-danger" id="deleteTenantBtn" onclick="deleteSelectedRoom()">Seçili Daireyi Sil</button>
        </div>

        <div id="tenantDetailContainer" style="margin-top: 15px;"></div>
    </div>

    <div class="card">
        <h3>💸 Apartman Giderleri Takip (<span id="activeApartmentExpenseTitle">Paslanmaz Apart</span>)</h3>
        <div class="form-group">
            <input type="text" id="expenseDesc" placeholder="Açıklama">
            <input type="number" id="expenseAmount" placeholder="Tutar (TL)">
            <input type="date" id="expenseDate">
            <button class="btn" onclick="addExpense()" style="background:#0284c7;">Gider Ekle</button>
        </div>
        <table>
            <thead>
                <tr>
                    <th>Gider Açıklaması</th>
                    <th>Tutar</th>
                    <th>Tarih</th>
                    <th>Ekleyen</th>
                    <th>İşlem</th>
                </tr>
            </thead>
            <tbody id="expenseTableBody"></tbody>
        </table>
    </div>
</div>

<script>
    const SUPABASE_URL = "https://bqdgmylhkfpgbcjmnrdw.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_sinZ4Aw33HQnOSVyRSGdFA_gwdSyy9j";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let activeUser = '';
    let currentApartment = 'Paslanmaz Apart';
    let selectedYear = '2026';

    let aptClickCounts = {};
    let aptClickTimers = {};
    
    const monthNames = ['Ocak', 'Şubat', 'Mart', 'Nisan', 'Mayıs', 'Haziran', 'Temmuz', 'Ağustos', 'Eylül', 'Ekim', 'Kasım', 'Aralık'];

    // Ayların Kronolojik Sırayla Üretilmesi
    function generateChronologicalMonthKeys() {
        let keys = [];
        for(let y = 2026; y <= 2030; y++) {
            for(let m = 0; m < 12; m++) {
                keys.push(`${monthNames[m]} ${y}`);
            }
        }
        return keys;
    }

    function generateAllMonthsList(baseRent, tenantName) {
        let list = {};
        const keys = generateChronologicalMonthKeys();
        keys.forEach(key => {
            list[key] = { tenant: tenantName, amount: baseRent, paid: false, note: '', by: '-' };
        });
        return list;
    }

    const initialDefaultData = {
        'Paslanmaz Apart': {
            rooms: [
                { id: 101, roomNumber: 'Daire 1', tenantName: 'Mehmet Emin Oğuz', rentAmount: 7000, startDate: '2025-08-24', paymentDay: '24', monthsData: generateAllMonthsList(7000, 'Mehmet Emin Oğuz') }
            ],
            expenses: []
        }
    };

    let db = initialDefaultData;
    let readReminders = [];

    async function loadSupabaseData() {
        try {
            const { data: aptData } = await _supabase.from('apartment_data').select('data').eq('id', 'main').single();
            if (aptData && aptData.data && Object.keys(aptData.data).length > 0) db = aptData.data;
            
            const { data: remData } = await _supabase.from('read_reminders').select('data').eq('id', 'main').single();
            if (remData && remData.data) readReminders = remData.data;

            for(let apt in db) {
                if(!db[apt].rooms) db[apt].rooms = [];
                if(!db[apt].expenses) db[apt].expenses = [];
                db[apt].rooms.forEach(room => {
                    if(!room.monthsData) room.monthsData = generateAllMonthsList(room.rentAmount, room.tenantName);
                });
            }
            if(!db[currentApartment]) currentApartment = Object.keys(db)[0] || 'Paslanmaz Apart';
            checkReminders();
            updateAllViews();
        } catch (error) { console.error(error); }
    }

    async function handleLogin() {
        if(document.getElementById('loginPassword').value === '345034') {
            activeUser = document.getElementById('loginUser').value;
            document.getElementById('displayUser').innerText = activeUser;
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('mainAppContainer').style.display = 'block';
            await loadSupabaseData();
        } else {
            document.getElementById('loginError').style.display = 'block';
        }
    }

    function handleLogout() {
        document.getElementById('mainAppContainer').style.display = 'none';
        document.getElementById('loginOverlay').style.display = 'flex';
    }

    function addNewApartment() {
        const nameInput = document.getElementById('newApartmentNameInput');
        const aptName = nameInput.value.trim();

        if(!aptName) return alert('Lütfen bir apartman adı yazın!');
        if(db[aptName]) return alert('Bu isimde bir apartman zaten var!');

        db[aptName] = { rooms: [], expenses: [] };
        currentApartment = aptName;
        nameInput.value = '';
        saveAndRender();
        alert(`"${aptName}" başarıyla eklendi!`);
    }

    function handleApartmentTabClick(aptName) {
        switchApartment(aptName);

        if (!aptClickCounts[aptName]) {
            aptClickCounts[aptName] = 0;
        }
        aptClickCounts[aptName]++;

        clearTimeout(aptClickTimers[aptName]);
        aptClickTimers[aptName] = setTimeout(() => {
            aptClickCounts[aptName] = 0;
        }, 1500);

        if (aptClickCounts[aptName] >= 4) {
            aptClickCounts[aptName] = 0;
            deleteApartment(aptName);
        }
    }

    function deleteApartment(aptName) {
        if (Object.keys(db).length <= 1) {
            alert('Sistemde en az 1 adet apartman bulunmalıdır, son kalan apartmanı silemezsiniz!');
            return;
        }

        if (confirm(`⚠️ DİKKAT!\n\n"${aptName}" isimli apartmanı ve içerisindeki TÜM DAİRELER ile GİDERLERİ silmek istediğinize emin misiniz?`)) {
            delete db[aptName];
            currentApartment = Object.keys(db)[0];
            saveAndRender();
            alert(`"${aptName}" apartmanı başarıyla silindi.`);
        }
    }

    function switchApartment(name) {
        currentApartment = name;
        document.getElementById('activeApartmentTitle').innerText = name;
        document.getElementById('activeApartmentExpenseTitle').innerText = name;
        updateAllViews();
    }

    function changeYearFilter(year) {
        selectedYear = year;
        renderTenantDetails();
    }

    function addRoom() {
        const roomNumber = document.getElementById('roomNumber').value.trim();
        const tenantName = document.getElementById('tenantName').value.trim();
        const rentAmount = Number(document.getElementById('rentAmount').value);
        const startDate = document.getElementById('startDate').value;
        const paymentDay = document.getElementById('paymentDay').value;

        if(!roomNumber || !tenantName || !rentAmount) return alert('Eksik bilgi girmeyin!');

        const newRoom = { id: Date.now(), roomNumber, tenantName, rentAmount, startDate, paymentDay, monthsData: generateAllMonthsList(rentAmount, tenantName) };
        db[currentApartment].rooms.push(newRoom);
        saveAndRender();
    }

    function toggleMonthPayment(roomId, monthKey) {
        const room = db[currentApartment].rooms.find(r => r.id === roomId);
        if(room && room.monthsData[monthKey]) {
            room.monthsData[monthKey].paid = !room.monthsData[monthKey].paid;
            room.monthsData[monthKey].by = activeUser;
            saveAndRender();
        }
    }

    function updateMonthNote(roomId, monthKey, val) {
        const room = db[currentApartment].rooms.find(r => r.id === roomId);
        if(room && room.monthsData[monthKey]) {
            room.monthsData[monthKey].note = val;
            room.monthsData[monthKey].by = activeUser;
            saveAndRender(false);
        }
    }

    function applyRentIncrease(roomId) {
        const newAmount = Number(document.getElementById(`newRentAmount_${roomId}`).value);
        const startMonthKey = document.getElementById(`startRentMonth_${roomId}`).value;
        if(!newAmount) return alert('Geçerli tutar girin!');

        const room = db[currentApartment].rooms.find(r => r.id === roomId);
        let apply = false;
        
        const allKeys = generateChronologicalMonthKeys();
        allKeys.forEach(k => {
            if(k === startMonthKey) apply = true;
            if(apply && room.monthsData[k]) room.monthsData[k].amount = newAmount;
        });

        room.rentAmount = newAmount;
        saveAndRender();
        alert('Kira zammı başarıyla uygulandı!');
    }

    function changeTenant(roomId) {
        const newTenant = document.getElementById(`newTenantName_${roomId}`).value.trim();
        const newAmount = Number(document.getElementById(`newTenantAmount_${roomId}`).value);
        const startMonthKey = document.getElementById(`startTenantMonth_${roomId}`).value;

        if(!newTenant || !newAmount) return alert('Lütfen Yeni Kiracı Adı ve Tutarı eksiksiz girin!');

        const room = db[currentApartment].rooms.find(r => r.id === roomId);
        let apply = false;

        const allKeys = generateChronologicalMonthKeys();
        allKeys.forEach(k => {
            if(k === startMonthKey) apply = true;
            if(apply && room.monthsData[k]) {
                room.monthsData[k].tenant = newTenant;
                room.monthsData[k].amount = newAmount;
                room.monthsData[k].paid = false;
                room.monthsData[k].note = '';
                room.monthsData[k].by = '-';
            }
        });

        room.tenantName = newTenant;
        room.rentAmount = newAmount;
        saveAndRender();
        alert('Kiracı başarıyla değiştirildi!');
    }

    function deleteSelectedRoom() {
        const id = Number(document.getElementById('selectedTenantSelect').value);
        if(id && confirm('Daireyi silmek istediğinize emin misiniz?')) {
            db[currentApartment].rooms = db[currentApartment].rooms.filter(r => r.id !== id);
            saveAndRender();
        }
    }

    function addExpense() {
        const desc = document.getElementById('expenseDesc').value.trim();
        const amount = Number(document.getElementById('expenseAmount').value);
        const date = document.getElementById('expenseDate').value;

        if(!desc || !amount || !date) return alert('Gider bilgilerini doldurun!');
        db[currentApartment].expenses.push({ id: Date.now(), desc, amount, date, addedBy: activeUser });
        saveAndRender();
    }

    function deleteExpense(id) {
        db[currentApartment].expenses = db[currentApartment].expenses.filter(e => e.id !== id);
        saveAndRender();
    }

    async function toggleReminder(id) {
        readReminders = readReminders.includes(id) ? readReminders.filter(i => i !== id) : [...readReminders, id];
        await _supabase.from('read_reminders').upsert({ id: 'main', data: readReminders });
        checkReminders();
    }

    async function saveAndRender(refresh = true) {
        await _supabase.from('apartment_data').upsert({ id: 'main', data: db });
        checkReminders();
        if(refresh) updateAllViews(); else renderExpenses();
    }

    function updateAllViews() {
        renderApartmentTabs();
        updateTenantDropdown();
        renderExpenses();
    }

    function renderApartmentTabs() {
        const container = document.getElementById('apartmentTabs');
        container.innerHTML = '';
        for(let apt in db) {
            const btn = document.createElement('button');
            btn.className = `tab-btn ${apt === currentApartment ? 'active' : ''}`;
            btn.innerText = apt;
            btn.title = 'Silmek için bu sekmeye peş peşe 4 kere tıklayın';
            btn.onclick = () => handleApartmentTabClick(apt);
            container.appendChild(btn);
        }
    }

    function checkReminders() {
        const container = document.getElementById('reminderContainer');
        const today = new Date();
        let reminders = [];

        for(let apt in db) {
            db[apt].rooms.forEach(room => {
                if(!room.startDate) return;
                const payDay = Number(room.paymentDay);
                let diff = payDay - today.getDate();
                if(diff === 0) reminders.push({ id: `${room.id}-today`, text: `<b>${apt} - ${room.roomNumber} (${room.tenantName})</b>: Bugün kira günü!` });
                else if(diff > 0 && diff <= 3) reminders.push({ id: `${room.id}-${payDay}`, text: `<b>${apt} - ${room.roomNumber} (${room.tenantName})</b>: Kira gününe ${diff} gün kaldı.` });
            });
        }
        if(!reminders.length) { container.innerHTML = ''; return; }

        let html = `<div class="alert-box"><h4>🔔 Hatırlatıcılar</h4>`;
        reminders.forEach(item => {
            let isRead = readReminders.includes(item.id);
            html += `<div class="reminder-row ${isRead ? 'read' : ''}" onclick="toggleReminder('${item.id}')">${item.text}</div>`;
        });
        container.innerHTML = html + `</div>`;
    }

    function updateTenantDropdown() {
        const select = document.getElementById('selectedTenantSelect');
        const currentVal = select.value;
        select.innerHTML = '';

        const rooms = db[currentApartment] ? db[currentApartment].rooms : [];
        if(!rooms.length) {
            select.innerHTML = `<option value="">Kayıtlı daire yok</option>`;
            document.getElementById('tenantDetailContainer').innerHTML = '';
            document.getElementById('deleteTenantBtn').style.display = 'none';
            return;
        }

        document.getElementById('deleteTenantBtn').style.display = 'inline-block';
        rooms.forEach(r => {
            select.innerHTML += `<option value="${r.id}">${r.roomNumber} - ${r.tenantName} (${r.rentAmount.toLocaleString('tr-TR')} ₺)</option>`;
        });
        if(rooms.some(r => r.id == currentVal)) select.value = currentVal;
        renderTenantDetails();
    }

    function renderTenantDetails() {
        const container = document.getElementById('tenantDetailContainer');
        const roomId = Number(document.getElementById('selectedTenantSelect').value);
        const room = db[currentApartment]?.rooms.find(r => r.id === roomId);

        if(!room) return;

        // Ayları takvim sırasına göre al
        const allChronologicalKeys = generateChronologicalMonthKeys();
        
        // Sadece seçili yıla ait ayları takvim sırasıyla filtrele
        let yearFilteredKeys = allChronologicalKeys.filter(k => k.endsWith(selectedYear));

        let monthOptions = allChronologicalKeys.map(k => `<option value="${k}">${k}</option>`).join('');

        let tableRowsHtml = yearFilteredKeys.map(k => {
            const item = room.monthsData[k] || { tenant: room.tenantName, amount: room.rentAmount, paid: false, note: '', by: '-' };
            return `
                <tr>
                    <td><b>${k}</b></td>
                    <td>${item.tenant}</td>
                    <td><b>${item.amount.toLocaleString('tr-TR')} ₺</b></td>
                    <td>
                        <button class="btn" style="background:${item.paid ? '#16a34a' : '#dc2626'}; padding:4px 8px; font-size:0.8rem;" onclick="toggleMonthPayment(${room.id}, '${k}')">
                            ${item.paid ? 'ÖDENDİ' : 'ÖDENMEDİ'}
                        </button>
                    </td>
                    <td><input type="text" class="note-input" value="${item.note || ''}" placeholder="Not..." onchange="updateMonthNote(${room.id}, '${k}', this.value)"></td>
                    <td><span class="badge">${item.by || '-'}</span></td>
                </tr>
            `;
        }).join('');

        let yearOptions = ['2026', '2027', '2028', '2029', '2030'].map(y => `<option value="${y}" ${y === selectedYear ? 'selected' : ''}>${y} Yılı</option>`).join('');

        container.innerHTML = `
            <div style="background:#e0f2fe; padding:12px; border-radius:6px; margin-bottom:15px; color:#0369a1;">
                Daire: <b>${room.roomNumber}</b> | Kiracı: <b>${room.tenantName}</b> | Mevcut Kira: <b>${room.rentAmount.toLocaleString('tr-TR')} ₺</b> | Ödeme Günü: <b>Her ayın ${room.paymentDay}. günü</b>
            </div>

            <div class="panel-box" style="background:#f0fdf4; border-color:#86efac;">
                <div class="panel-title" style="color:#15803d;">📅 Tabloda Gösterilecek Yılı Seç:</div>
                <select onchange="changeYearFilter(this.value)" style="width:100%; max-width:300px; font-weight:bold; padding:10px;">
                    ${yearOptions}
                </select>
            </div>

            <div class="panel-box" style="background:#f0f9ff; border-color:#93c5fd;">
                <div class="panel-title" style="color:#1d4ed8;">🔄 Kiracı Değiştir:</div>
                <div class="form-group" style="margin-bottom:0;">
                    <select id="startTenantMonth_${room.id}" style="max-width:180px;">${monthOptions}</select>
                    <input type="text" id="newTenantName_${room.id}" placeholder="Yeni Kiracı Ad Soyad">
                    <input type="number" id="newTenantAmount_${room.id}" placeholder="Yeni Kira Tutarı (TL)">
                    <button class="btn" onclick="changeTenant(${room.id})" style="background:#0284c7;">Kiracıyı Değiştir</button>
                </div>
            </div>

            <div class="panel-box">
                <div class="panel-title" style="color:#334155;">📈 Kira Zammı Uygula:</div>
                <div class="form-group" style="margin-bottom:0;">
                    <select id="startRentMonth_${room.id}" style="max-width:180px;">${monthOptions}</select>
                    <input type="number" id="newRentAmount_${room.id}" placeholder="Yeni Zamlı Tutar (TL)">
                    <button class="btn" onclick="applyRentIncrease(${room.id})">Zammı Uygula</button>
                </div>
            </div>

            <h4 style="margin-top:20px; color:#1e293b;">📋 ${selectedYear} Yılı Aylık Kira Tablosu</h4>
            <table>
                <thead>
                    <tr>
                        <th>Dönem</th>
                        <th>Kiracı</th>
                        <th>Tutar</th>
                        <th>Durum</th>
                        <th>Not</th>
                        <th>İşlem Yapan</th>
                    </tr>
                </thead>
                <tbody>${tableRowsHtml}</tbody>
            </table>
        `;
    }

    function renderExpenses() {
        const tbody = document.getElementById('expenseTableBody');
        tbody.innerHTML = '';
        const expenses = db[currentApartment]?.expenses || [];
        if(!expenses.length) { tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#64748b;">Gider yok.</td></tr>`; return; }

        expenses.forEach(e => {
            tbody.innerHTML += `
                <tr>
                    <td><b>${e.desc}</b></td>
                    <td><b style="color:#dc2626;">${e.amount.toLocaleString('tr-TR')} ₺</b></td>
                    <td>${e.date}</td>
                    <td><span class="badge">${e.addedBy || '-'}</span></td>
                    <td><button class="btn-danger" style="padding:2px 6px;" onclick="deleteExpense(${e.id})">Sil</button></td>
                </tr>
            `;
        });
    }
</script>
</body>
</html>
